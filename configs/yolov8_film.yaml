# YOLOv8n with FiLM at [4, 6, 8] (early - yolov8's C2f backbone numbers
# stages the same way yolo26's C3k2 backbone does, so the early/late
# indices carry over directly; see semdetect/models/yolo_film.py's module
# docstring). Early is the default placement now that it beat late for
# yolo26n on this dataset - see ball_film_early.yaml vs.
# ball_film_late.yaml. Otherwise identical to configs/ball_film_early.yaml
# - swap model.variant to compare YOLO generations directly (yolov8n /
# yolo11n / yolo26n). (An earlier version of this run used late placement
# ([15, 18, 21], auto-discovered), archived at
# outputs/sweep/yolov8_film_late/.)
name: yolov8_film

data:
  train_manifest: data/manifest/train.csv
  val_manifest: data/manifest/val.csv
  test_manifest: data/manifest/test.csv
  descriptions_csv: data/ball_descriptions.csv
  description_field: Description
  class_names: [ball]
  img_size: 640
  augment: true
  num_workers: 2

embedding:
  provider: clip
  model_name: ViT-B-32-quickgelu
  pretrained: openai
  device: cpu

model:
  architecture: yolo
  variant: yolov8n
  pretrained: false
  use_film: true
  film_hidden_dim: 256
  film_layer_indices: [4, 6, 8] # early (default): backbone P3/P4/P5, pre-neck-fusion

train:
  epochs: 200
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 42
  eval_interval: 1
  conf_thres: 0.25
  output_dir: outputs/sweep/yolov8_film
  checkpoint_metric: map_50
  log_interval: 20
