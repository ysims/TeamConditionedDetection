# FiLM conditioning applied late: the exact P3/P4/P5 feature maps that
# feed the Detect head (model.film_layer_indices left unset -> auto ->
# [16, 19, 22] for yolo26n), after both the backbone and the neck's
# cross-scale fusion. This is what "FiLM on" meant before the early/late
# split existed - kept as its own config so it's a stable comparison
# point. See configs/ball_film_early.yaml for the backbone-level variant
# and semdetect/models/yolo_film.py's module docstring for the full
# layer-by-layer map / reasoning.
#
# Pairs with configs/ball_baseline.yaml and configs/ball_film_early.yaml
# for a 3-way comparison - identical in every other respect.
#
# Trained on the merged manifest (data/manifest), pooled from every
# NUpbr render run - see scripts/prepare_nupbr_dataset.py.
name: ball_film_late

data:
  train_manifest: data/manifest/train.csv
  val_manifest: data/manifest/val.csv
  test_manifest: data/manifest/test.csv
  descriptions_csv: data/ball_descriptions.csv
  # "Description" is the full sentence; "Colours" is the shorter
  # comma-separated colour list flagged as possibly stronger signal -
  # worth an A/B of its own once FiLM placement is settled.
  description_field: Description
  class_names: [ball]
  img_size: 640
  augment: true
  num_workers: 2

embedding:
  provider: clip
  model_name: ViT-B-32-quickgelu
  pretrained: openai
  device: cpu

model:
  architecture: yolo
  variant: yolo26n
  pretrained: false
  use_film: true
  film_hidden_dim: 256
  film_layer_indices: null # auto -> [16, 19, 22], the Detect head's own inputs

train:
  epochs: 50
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 42
  eval_interval: 1
  conf_thres: 0.25
  output_dir: outputs/sweep/ball_film_late
  checkpoint_metric: map_50
  log_interval: 20
