# Same as robot_jersey_fasterrcnn_role_head.yaml (Faster R-CNN two-stage,
# pretrained) but the role head's conditioner is AdaIN instead of FiLM -
# per-sample, per-channel instance normalization (mean/std over the RoI
# crop's own H,W) before applying a FiLM-style predicted affine. The other
# standout mechanism from the earlier ball-description experiments.
#
# Run with:
#   python -m team_conditioned_detection.train_robots --config configs/robot_jersey_fasterrcnn_role_head_adain.yaml
name: robot_jersey_fasterrcnn_role_head_adain

data:
  train_manifest: data/manifest_robots/train.csv
  val_manifest: data/manifest_robots/val.csv
  test_manifest: data/manifest_robots/test.csv
  img_size: 640
  augment: true
  num_workers: 2

model:
  architecture: fasterrcnn_robot_role
  variant: resnet50
  pretrained: true
  film_hidden_dim: 256
  conditioning_method: adain
  auxiliary_loss_weight: 1.0
  roi_output_size: 8

train:
  epochs: 200
  batch_size: 4
  lr: 0.001
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 42
  eval_interval: 1
  conf_thres: 0.25
  output_dir: outputs/robot_jersey/robot_jersey_fasterrcnn_role_head_adain
  checkpoint_metric: loss
  checkpoint_metric_mode: min
  log_interval: 20
  early_stopping_metrics: [detection_loss, role_loss, role_acc]
  early_stopping_modes: [min, min, max]
  early_stopping_patience: 50
  early_stopping_min_delta: 0.01
