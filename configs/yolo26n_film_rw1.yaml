# FiLM role head on YOLO26n.
# Role-loss weight 1.0 (as Faster R-CNN) instead of 0.1: tests whether the weight confounds the detector comparison. Otherwise identical to yolo26n_film.yaml.
#   python -m team_detect.train --config configs/yolo26n_film_rw1.yaml --seed 42
name: yolo26n_film_rw1
data:
  train_manifest: data/manifest_robots/train.csv
  val_manifest: data/manifest_robots/val.csv
  test_manifest: data/manifest_robots/test.csv
  img_size: 640
  augment: true
  num_workers: 2
  eval_seed: 0
model:
  architecture: yolo_robot_role
  variant: yolo26n
  pretrained: true
  conditioning_method: film
  hidden_dim: 256
  role_loss_weight: 1.0
  roi_output_size: 8
  use_distance_feature: false
train:
  epochs: 200
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 42
  conf_thres: 0.25
  checkpoint_metric: loss
  checkpoint_metric_mode: min
  early_stopping_metrics: [detection_loss, role_loss, role_acc]
  early_stopping_modes: [min, min, max]
  early_stopping_patience: 50
  early_stopping_min_delta: 0.02
  output_dir: outputs/yolo26n_film_rw1/seed42
