# RT-DETR two-stage role head (team_conditioned_detection/models/robot_role.py's
# RTDETRRobotRoleDetector), pretrained backbone, FiLM-only (RGB) role head
# - matches robot_jersey_role_head_pretrained_film_only.yaml (YOLO) and
# robot_jersey_fasterrcnn_role_head_film_only.yaml (Faster R-CNN) so all
# three backbones are compared under the identical, settled role-head
# config for the backbone comparison table. lr/batch_size follow the
# archived configs/archive_pre_sweep/rtdetr_film.yaml convention (RT-DETR
# needs a lower LR and smaller batch than YOLO/Faster R-CNN here).
#
# Run with:
#   python -m team_conditioned_detection.train_robots --config configs/robot_jersey_rtdetr_role_head_pretrained_film_only.yaml
name: robot_jersey_rtdetr_role_head_pretrained_film_only_seed43

data:
  train_manifest: data/manifest_robots/train.csv
  val_manifest: data/manifest_robots/val.csv
  test_manifest: data/manifest_robots/test.csv
  img_size: 640
  augment: true
  num_workers: 2

model:
  architecture: rtdetr_robot_role
  variant: rtdetr-l
  pretrained: true
  film_hidden_dim: 256
  roi_output_size: 8
  role_head_use_deep_feature: true
  role_head_use_distance_feature: false

train:
  epochs: 200
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 43
  eval_interval: 1
  conf_thres: 0.25
  output_dir: outputs/robot_jersey/robot_jersey_rtdetr_role_head_pretrained_film_only_seed43
  checkpoint_metric: loss
  checkpoint_metric_mode: min
  log_interval: 20
  early_stopping_metrics: [detection_loss, role_loss, role_acc]
  early_stopping_modes: [min, min, max]
  early_stopping_patience: 50
  early_stopping_min_delta: 0.02
