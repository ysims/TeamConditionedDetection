# RT-DETR baseline (no FiLM). Pairs with configs/rtdetr_film.yaml.
# rtdetr-l is a much larger model than yolo26n (~33M vs ~2.5M params,
# see outputs/params_report.csv) - a data point for whether the extra
# capacity buys anything on a single-class, low-resource task like this.
name: rtdetr_baseline

data:
  train_manifest: data/manifest/train.csv
  val_manifest: data/manifest/val.csv
  test_manifest: data/manifest/test.csv
  descriptions_csv: data/ball_descriptions.csv
  description_field: Description
  class_names: [ball]
  img_size: 640
  augment: true
  num_workers: 2

embedding:
  provider: clip
  model_name: ViT-B-32-quickgelu
  pretrained: openai
  device: cpu

model:
  architecture: rtdetr
  variant: rtdetr-l
  pretrained: false
  use_film: false
  film_hidden_dim: 256

train:
  batch_size: 8 # rtdetr-l is much larger than yolo26n; lower to fit comfortably
  lr: 0.0001 # transformer decoders are more sensitive to LR than CNNs
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 42
  eval_interval: 1
  conf_thres: 0.25
  output_dir: outputs/sweep/rtdetr_baseline
  checkpoint_metric: map_50
  log_interval: 20
