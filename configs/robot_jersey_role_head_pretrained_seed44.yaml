# Same as robot_jersey_role_head.yaml (YOLO two-stage, FiLM role head) but
# with an ImageNet/COCO-pretrained yolo26n backbone instead of from-scratch
# weights - see RobotRoleDetector._load_pretrained_backbone in
# team_conditioned_detection/models/robot_role.py (partial load matched by tensor
# name+shape; the detection head itself doesn't transfer since nc differs,
# only the backbone does).
#
# Run with:
#   python -m team_conditioned_detection.train_robots --config configs/robot_jersey_role_head_pretrained.yaml
name: robot_jersey_role_head_pretrained_seed44

data:
  train_manifest: data/manifest_robots/train.csv
  val_manifest: data/manifest_robots/val.csv
  test_manifest: data/manifest_robots/test.csv
  img_size: 640
  augment: true
  num_workers: 2

model:
  architecture: yolo_robot_role
  variant: yolo26n
  pretrained: true
  film_hidden_dim: 256
  roi_output_size: 8

train:
  epochs: 200
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 44
  eval_interval: 1
  conf_thres: 0.25
  output_dir: outputs/robot_jersey/robot_jersey_role_head_pretrained_seed44
  checkpoint_metric: loss
  checkpoint_metric_mode: min
  log_interval: 20
  early_stopping_metrics: [detection_loss, role_loss, role_acc]
  early_stopping_modes: [min, min, max]
  early_stopping_patience: 50
  early_stopping_min_delta: 0.02
