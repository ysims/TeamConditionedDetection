# Ball detection baseline: no FiLM. Pairs with configs/ball_film_late.yaml
# and configs/ball_film_early.yaml (identical except model.use_film /
# model.film_layer_indices) for a 3-way comparison - the CLIP embedding
# is still computed by the dataset (so the data pipeline is byte-for-byte
# identical across all three) but never reaches the network here.
#
# Trained on the merged manifest (data/manifest), pooled from every
# NUpbr render run - see scripts/prepare_nupbr_dataset.py.
name: ball_baseline

data:
  train_manifest: data/manifest/train.csv
  val_manifest: data/manifest/val.csv
  test_manifest: data/manifest/test.csv
  descriptions_csv: data/ball_descriptions.csv
  description_field: Description
  class_names: [ball]
  img_size: 640
  augment: true
  num_workers: 2

embedding:
  provider: clip
  model_name: ViT-B-32-quickgelu
  pretrained: openai
  device: cpu

model:
  architecture: yolo
  variant: yolo26n
  pretrained: false
  use_film: false
  film_hidden_dim: 256

train:
  epochs: 50
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 42
  eval_interval: 1
  conf_thres: 0.25
  output_dir: outputs/sweep/ball_baseline
  checkpoint_metric: map_50
  log_interval: 20
