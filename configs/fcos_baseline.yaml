# FCOS (ResNet-50 FPN) baseline, no FiLM. Pairs with configs/fcos_film.yaml.
# Anchor-free/one-stage, like YOLO, but with a much heavier ResNet-50
# backbone (~32M params vs yolo26n's ~2.5M) - isolates "anchor-free head
# design" from "backbone size" against the YOLO runs.
name: fcos_baseline

data:
  train_manifest: data/manifest/train.csv
  val_manifest: data/manifest/val.csv
  test_manifest: data/manifest/test.csv
  descriptions_csv: data/ball_descriptions.csv
  description_field: Description
  class_names: [ball]
  img_size: 640
  augment: true
  num_workers: 2

embedding:
  provider: clip
  model_name: ViT-B-32-quickgelu
  pretrained: openai
  device: cpu

model:
  architecture: fcos
  variant: resnet50
  pretrained: false
  use_film: false
  film_hidden_dim: 256

train:
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 42
  eval_interval: 1
  conf_thres: 0.25
  output_dir: outputs/sweep/fcos_baseline
  checkpoint_metric: map_50
  log_interval: 20
