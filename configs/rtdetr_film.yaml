# RT-DETR with FiLM at [3, 7, 9] - the backbone-level equivalent of the
# hybrid encoder's [21, 24, 27] output (which feeds RTDETRDecoder), same
# resolutions but before the encoder's cross-scale fusion. Early beat
# late for yolo26n on this dataset (see configs/ball_film_early.yaml vs.
# ball_film_late.yaml), so early is the default placement everywhere now
# except the configs specifically comparing placement - see
# semdetect/models/rtdetr_film.py for the full layer map. Pairs with
# configs/rtdetr_baseline.yaml.
name: rtdetr_film

data:
  train_manifest: data/manifest/train.csv
  val_manifest: data/manifest/val.csv
  test_manifest: data/manifest/test.csv
  descriptions_csv: data/ball_descriptions.csv
  description_field: Description
  class_names: [ball]
  img_size: 640
  augment: true
  num_workers: 2

embedding:
  provider: clip
  model_name: ViT-B-32-quickgelu
  pretrained: openai
  device: cpu

model:
  architecture: rtdetr
  variant: rtdetr-l
  pretrained: false
  use_film: true
  film_hidden_dim: 256
  film_layer_indices: [3, 7, 9] # early (default): backbone P3/P4/P5, pre-encoder-fusion

train:
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0005
  optimizer: adamw
  device: cuda
  seed: 42
  eval_interval: 1
  conf_thres: 0.25
  output_dir: outputs/sweep/rtdetr_film
  checkpoint_metric: map_50
  log_interval: 20
